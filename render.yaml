# Render Blueprint — free deployment for the LandVille backend.
# Deploy: push this repo to GitHub, then in Render → "New +" → "Blueprint",
# point it at this repo. Render reads this file and provisions the service.
# Set the `sync: false` secrets in the Render dashboard (never commit them).
#
# Database: use a free Neon Postgres project (https://neon.tech) and paste its
# connection string into DATABASE_URL. Render's own free Postgres expires, Neon
# does not. No Redis is required on the free tier — Channels falls back to an
# in-memory layer and Celery runs tasks inline (see settings.py).

services:
  - type: web
    name: landville-backend
    runtime: python
    plan: free
    # branch: develop   # uncomment / change to control which branch deploys
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "python manage.py migrate --noinput && daphne -b 0.0.0.0 -p $PORT landville.asgi:application"
    healthCheckPath: /api/v1/properties/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      # Generated once by Render and kept secret — do not set by hand.
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # Secrets / per-environment values — set these in the Render dashboard.
      - key: DATABASE_URL          # Neon connection string
        sync: false
      - key: ALLOWED_HOSTS         # e.g. landville-backend.onrender.com
        sync: false
      - key: CORS_WHITELIST        # e.g. https://landville-frontend.onrender.com
        sync: false
      - key: CSRF_TRUSTED_ORIGINS  # e.g. https://landville-frontend.onrender.com
        sync: false
      - key: FRONT_END_URL         # e.g. https://landville-frontend.onrender.com
        sync: false
      - key: DOMAIN                # e.g. https://landville-backend.onrender.com
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # Production security — safe defaults behind Render's TLS proxy.
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "3600"
