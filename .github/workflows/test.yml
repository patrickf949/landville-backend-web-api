name: Test & Upload Coverage

on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ develop, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: landville_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: 'ci-secret-key-for-automated-tests-in-github-actions'
      DEBUG: 'False'
      DATABASE_URL: 'postgres://postgres:password@localhost:5432/landville_test'
      REDIS_URL: 'redis://localhost:6379'
      CELERY_TASK_ALWAYS_EAGER: 'true'
      DOMAIN: 'http://localhost:8000'
      DEFAULT_FROM_EMAIL: 'ci@landville.local'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          coverage run --source='authentication/,property/,utils/,pages/,chat/,landville/' manage.py test
          coverage report
          mkdir -p coverage
          coverage lcov -o coverage/lcov.info

      - name: Coveralls
        uses: coverallsapp/github-action@v2
        continue-on-error: true
        with:
          file: coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}

      - name: Store coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
